name: CloudPilot CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Backend Test Suites & Coverage
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci_password
          POSTGRES_DB: cloudpilot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/auth-service/requirements.txt
          pip install -r backend/cloud-service/requirements.txt
          pip install pytest pytest-cov httpx

      - name: Execute Automated Regression Test Suites
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres_ci_password@localhost:5432/cloudpilot_test
          TESTING: 'true'
          JWT_SECRET: ci_test_jwt_secret_key_123456
          FERNET_KEY: 9AHRW3AtKGsdZ6BIELRR4NjPRHFjOfRggwI9Tu0T9zI=
        run: |
          python run_tests.py

